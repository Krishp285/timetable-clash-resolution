<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 System Error | Timetable Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand-rose: #f43f5e;
            --brand-amber: #f59e0b;
            --bg-body: #090d16;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        .ambient-bg {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
        }
        .orb {
            position: absolute; border-radius: 50%; filter: blur(120px); opacity: 0.35;
            animation: orbFloat 22s ease-in-out infinite alternate;
        }
        .orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--brand-rose), transparent 70%); top: -100px; left: -100px; }
        .orb-2 { width: 450px; height: 450px; background: radial-gradient(circle, var(--brand-amber), transparent 70%); bottom: -100px; right: -100px; }

        @keyframes orbFloat {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, -30px); }
        }

        .error-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 3.5rem 3rem;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 1;
        }

        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.35rem 0.95rem;
            border-radius: 20px;
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fda4af;
            font-size: 0.82rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .error-code {
            font-size: 6.5rem;
            font-weight: 900;
            line-height: 1;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 50%, var(--brand-rose) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
            margin-bottom: 0.8rem;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-sub);
            font-size: 0.98rem;
            line-height: 1.6;
            margin-bottom: 2.25rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            padding: 0.85rem 1.85rem;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--brand-rose) 0%, var(--brand-amber) 100%);
            color: white;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            box-shadow: 0 4px 20px rgba(244, 63, 94, 0.35);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-home:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(244, 63, 94, 0.5);
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="error-card">
        <div class="error-badge">
            <i class="fas fa-bug"></i> Error 500 &bull; Internal Server Exception
        </div>
        <div class="error-code">500</div>
        <h1>System Exception</h1>
        <p>An unexpected server exception occurred while processing the request. The diagnostic log has been registered.</p>
        
        <a href="{{ url_for('admin_dashboard') }}" class="btn-home">
            <i class="fas fa-rotate"></i> Return to Command Center
        </a>
    </div>
</body>
</html>
