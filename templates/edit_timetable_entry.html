{% extends 'base.html' %}
{% block title %}Edit Entry{% endblock %}

{% block content %}
<div class="card" style="max-width: 700px; margin: 0 auto;">
    <div class="card-header">
        <h1 class="card-title">
            <i class="fas fa-edit"></i> Edit Timetable Entry
        </h1>
    </div>
    
    <div style="background: rgba(30, 41, 59, 0.5); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; border: 1px solid rgba(148, 163, 184, 0.08);">
        <h3 style="margin-bottom: 1rem; color: #94a3b8; font-weight: 700;">Current Entry Details</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div>
                <strong style="color: #64748b;">Subject:</strong><br>
                <span style="color: #f1f5f9;">{{ entry.subject.name }}</span>
            </div>
            <div>
                <strong style="color: #64748b;">Day:</strong><br>
                <span style="color: #f1f5f9;">{{ entry.day }}</span>
            </div>
            <div>
                <strong style="color: #64748b;">Time:</strong><br>
                <span style="color: #f1f5f9;">{{ entry.time_slot.time_range }}</span>
            </div>
            <div>
                <strong style="color: #64748b;">Division:</strong><br>
                <span style="color: #f1f5f9;">{{ entry.division.full_name }}</span>
            </div>
        </div>
    </div>
    
    <form method="POST">
        <div class="form-group">
            <label class="form-label">Faculty</label>
            <select name="faculty_id" class="form-control" required>
                {% for faculty in faculty_list %}
                <option value="{{ faculty.faculty_id }}" 
                        {% if faculty.faculty_id == entry.faculty_id %}selected{% endif %}
                        {% if not faculty.is_available and faculty.faculty_id != entry.faculty_id %}disabled{% endif %}>
                    {{ faculty.name }}
                    {% if not faculty.is_available and faculty.faculty_id != entry.faculty_id %}
                        (Busy)
                    {% elif faculty.is_available %}
                        (Available)
                    {% endif %}
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label class="form-label">Room / Resource</label>
            <select name="room_number" class="form-control" required>
                {% for room in rooms %}
                <option value="{{ room.name }}" {% if room.name == entry.room_number %}selected{% endif %}>
                    {{ room.name }} (Capacity: {{ room.capacity }}, {{ room.room_type }})
                </option>
                {% endfor %}
            </select>
        </div>
        
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-success">
                <i class="fas fa-save"></i> Update Entry
            </button>
            <a href="{{ url_for('timetable_create', division_id=entry.division_id, day=entry.day) }}" class="btn btn-secondary">
                <i class="fas fa-times"></i> Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
