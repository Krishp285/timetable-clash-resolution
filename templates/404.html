<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            text-align: center;
            padding: 2rem;
            overflow: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: 
                radial-gradient(ellipse 400px 400px at 30% 40%, rgba(124, 58, 237, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 350px 350px at 70% 60%, rgba(56, 189, 248, 0.08) 0%, transparent 70%);
            animation: bgDrift 20s ease-in-out infinite alternate;
            z-index: 0;
        }
        @keyframes bgDrift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(2%, -2%); }
        }
        .error-container {
            max-width: 600px;
            position: relative;
            z-index: 1;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #7c3aed 0%, #06d6a0 50%, #38bdf8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.05em;
            line-height: 1;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            font-weight: 800;
            color: #f1f5f9;
        }
        p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            color: #94a3b8;
        }
        .btn {
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #06d6a0 0%, #0ea5e9 100%);
            color: #0a0e1a;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            font-family: 'Inter', sans-serif;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(6, 214, 160, 0.3);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1><i class="fas fa-compass"></i> Page Not Found</h1>
        <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">
            <i class="fas fa-home"></i> Back to Home
        </a>
    </div>
</body>
</html>
